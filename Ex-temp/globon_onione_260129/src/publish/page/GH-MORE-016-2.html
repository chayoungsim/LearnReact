<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>걸음수 - 목표설정</title>
    <link rel="stylesheet" href="../../assets/styles/style.css" />
    <script type="module" src="../../utils/ui_common.js"></script>
  </head>
  <body>
    <!-- 전체 화면 모달 -->
    <div class="modal-overlay modal-fullscreen is-active" id="modalFullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title"></h2>
                <button class="modal-close" onclick="closeModal('modalFullscreen')"><i class="ico-x"></i><span class="sr-only">닫기</span></button>
            </div>
            <div class="modal-body">
                <div class="modal-body-cont">
                    <div class="title-type">
                        <h3 class="text-h5">
                            하루 목표 걸음수를 </br> 
                            설정해주세요
                        </h3>
                    </div>
                    <ul class="link-arr-lists">
                        <li>                            
                            <div class="wheel-picker-wrapper">
                                <div class="highlight-bar wide">
                                    <div></div>
                                </div>
                                <div class="picker-columns">                        
                                    <div class="wheel-column" id="steps">
                                        <div class="wheel-items">
                                        </div>
                                    </div>
                                    <div class="unit-label wide-bar">걸음</div>                       
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-fill btn-primary">
                    <strong>추가</strong>
                </button>
                
            </div>
        </div>
    </div>


<script type="module">
import { createWheel } from '../../utils/wheelpicker.js';

createWheel({
  container: document.getElementById('steps'),
  min: 1000,
  max: 10000,
  initialValue: 8000,
  step: 10,
  onChange: val => {
    console.log('걸음수:', val);
  }
});
</script>

  </body>
</html>
