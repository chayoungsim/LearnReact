<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wheel-picke</title>
    <link rel="stylesheet" href="../../assets/styles/style.css" />

 
</head>
<body>
    <div class="picker-modal-overlay">
        <div class="picker-modal-container">
            <div class="picker-header">
                <h3>몸무게 선택</h3>
            </div>              
            <div class="wheel-picker-wrapper">
                <div class="highlight-bar">
                    <div></div>
                    <div></div>
                </div>
                <div class="picker-columns">                        
                    <div class="wheel-column" id="integer">
                        <div class="wheel-items">
                        </div>
                    </div>
                    <div class="dot">.</div>
                    <div class="wheel-column" id="decimals">
                        <div class="wheel-items">
                        </div>
                    </div> 
                    <div class="unit-label">kg</div>                       
                </div>
            </div>
            <div class="picker-footer">
                <button class="btn-bor" onClick={onClose}>취소</button>
                <button class="btn-fill btn-primary" onClick={handleAdd}>추가</button>
            </div>
        </div>
    </div>

  <script type="module">
    import { initWeightWheel, getSelectedWeight } from '../../utils/wheelpicker.js';
    
    // DOM이 로드된 후 초기화
    document.addEventListener('DOMContentLoaded', () => {
      initWeightWheel();
      
      // 선택된 값 확인 (선택사항)
      console.log('Selected weight:', getSelectedWeight());
    });
  </script>  

</body>
</html>
