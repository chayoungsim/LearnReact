<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>wheel-picke</title>

        <link rel="stylesheet" href="../../assets/styles/style.css" />
    </head>
    <body>
        <div class="picker-modal-overlay">
            <div class="picker-modal-container">
                <div class="picker-header">
                    <h3>몸무게 선택</h3>
                </div>
                <div class="wheel-picker-wrapper" id="weightPickerTrigger">
                    <div class="highlight-bar">
                        <div></div>
                        <div></div>
                    </div>
                    <div class="picker-columns">
                        <div class="wheel-column" id="selectedInteger">
                            <!-- <div class="padding-dummy"></div>
                            <div class="wheel-item">30</div>
                            <div class="wheel-item active">31</div>
                            <div class="wheel-item">32</div>
                            <div class="padding-dummy"></div> -->
                        </div>
                        <div class="dot">.</div>
                        <div class="wheel-column" id="selectedDecimal">
                            <!-- <div class="padding-dummy"></div>
                            <div class="wheel-item decimal">1</div>
                            <div class="wheel-item decimal active">2</div>
                            <div class="wheel-item decimal">3</div>
                            <div class="padding-dummy"></div> -->
                        </div>
                        <div class="unit-label">kg</div>
                    </div>
                </div>
                <div class="picker-footer">
                    <button class="btn-bor" onClick="{onClose}">취소</button>
                    <button class="btn-fill btn-primary" onClick="{handleAdd}">추가</button>
                </div>
            </div>
        </div>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/iosselect/2.1.0/iosSelect.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iosselect/2.1.0/iosSelect.min.js"></script>
        <script>
          const WeightPickerModule = (function() {
    // 1. 데이터 생성 (30~100kg, 소수점 0~9)
    const getIntegerData = () => {
        let arr = [];
        for (let i = 30; i <= 100; i++) {
            arr.push({ id: i.toString(), value: i.toString() });
        }
        return arr;
    };

    const getDecimalData = () => {
        let arr = [];
        for (let i = 0; i <= 9; i++) {
            arr.push({ id: i.toString(), value: i.toString() });
        }
        return arr;
    };

    // 2. 피커 실행 함수
    const init = () => {
        const trigger = document.querySelector('#weightPickerTrigger');
        const integerDisplay = document.querySelector('#selectedInteger');
        const decimalDisplay = document.querySelector('#selectedDecimal');

        trigger.addEventListener('click', function() {
            const integerData = getIntegerData();
            const decimalData = getDecimalData();

            // 현재 표시된 값을 초기값으로 설정
            const currentInt = integerDisplay.innerText;
            const currentDec = decimalDisplay.innerText;

            new IosSelect(2, [integerData, decimalData], {
                title: '체중 선택',
                itemHeight: 40,
                headerHeight: 44,
                oneLevelId: currentInt, // 초기값 설정
                twoLevelId: currentDec,
                callback: function (selectOneObj, selectTwoObj) {
                    // 선택 완료 시 화면 업데이트
                    integerDisplay.innerText = selectOneObj.value;
                    decimalDisplay.innerText = selectTwoObj.value;
                    
                    console.log(`선택된 값: ${selectOneObj.value}.${selectTwoObj.value} kg`);
                }
            });
        });
    };

    return { init };
})();

// 실행
document.addEventListener('DOMContentLoaded', WeightPickerModule.init);

        </script>
    </body>
</html>
