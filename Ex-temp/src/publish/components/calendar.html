<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
    <link rel="stylesheet" href="../../../assets/styles/style.css" />

 
    <script type="module" src="../../utils/ui_common.js"></script>
</head>
<body>

    <!-- Calendar -->
    <div class="weekly-container">
        <div class="weekly-header">
            <div class="weekly-title">2025.09 <span class="arrow-down">▼</span></div>
            <button class="btn-report">주간 리포트</button>
        </div>
        <div class="weekly-grid ">
            <div class="weekly-day-col">
                <div class="weekly-day-name">일</div>
                <div class="weekly-chart-area">
                    <div class="weekly-donut-wrap">
                        <svg width="40" height="40" class="weekly-donut">
                            <circle stroke="#00E0C7" stroke-width="3" fill="transparent" r="18.5" cx="20" cy="20" stroke-dasharray="116.23892818282235" stroke-dashoffset="29.059732045705587" stroke-linecap="round" transform="rotate(-90 20 20)"></circle>
                        </svg>
                        <span class="weekly-date-num">14</span>
                    </div>
                </div>
            </div>
            <div class="weekly-day-col">
                <div class="weekly-day-name">월</div>
                <div class="weekly-chart-area">
                    <div class="weekly-donut-wrap">
                        <svg width="40" height="40" class="weekly-donut"></svg>
                        <span class="weekly-date-num">14</span>
                    </div>
                </div>
            </div>
            <div class="weekly-day-col selected">
                <div class="weekly-day-name">화</div>
                <div class="weekly-chart-area">
                    <div class="weekly-donut-wrap">
                        <svg width="40" height="40" class="weekly-donut"></svg>
                        <span class="weekly-date-num">14</span>
                    </div>
                </div>
            </div>
            <div class="weekly-day-col">
                <div class="weekly-day-name">수</div>
                <div class="weekly-chart-area">
                    <div class="weekly-donut-wrap">
                        <svg width="40" height="40" class="weekly-donut"></svg>
                        <span class="weekly-date-num">14</span>
                    </div>
                </div>
            </div>
            <div class="weekly-day-col">
                <div class="weekly-day-name">목</div>
                <div class="weekly-chart-area">
                    <div class="weekly-donut-wrap">
                        <svg width="40" height="40" class="weekly-donut"></svg>
                        <span class="weekly-date-num">14</span>
                    </div>
                </div>
            </div>
            <div class="weekly-day-col">
                <div class="weekly-day-name">금</div>
                <div class="weekly-chart-area">
                    <div class="weekly-donut-wrap">
                        <svg width="40" height="40" class="weekly-donut"></svg>
                        <span class="weekly-date-num">14</span>
                    </div>
                </div>
            </div>
            <div class="weekly-day-col">
                <div class="weekly-day-name">토</div>
                <div class="weekly-chart-area">
                    <div class="weekly-donut-wrap">
                        <svg width="40" height="40" class="weekly-donut"></svg>
                        <span class="weekly-date-num">14</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Calendar2 -->
    <div class="range-calendar-container">
        <div class="range-top-info">
            <span class="info-label">목표 달성 기한</span>
            <span class="info-value">2026.01.16 부터</span>
        </div>
        <div class="range-header">
            <button class="range-nav-btn">‹</button>
            <div class="range-title">2026년 2월<span class="picker-arrow ">▼</span></div>
            <button class="range-nav-btn">›</button>
        </div>
        <div class="range-weekdays">
            <div class="weekday-cell sun">일</div>
            <div class="weekday-cell ">월</div>
            <div class="weekday-cell ">화</div>
            <div class="weekday-cell ">수</div>
            <div class="weekday-cell ">목</div>
            <div class="weekday-cell ">금</div>
            <div class="weekday-cell sat">토</div>
        </div>
        <div class="range-days-grid">
            <div class="range-day-cell holiday-sun"><span class="day-text">1</span></div>
            <div class="range-day-cell"><span class="day-text">2</span></div>
            <div class="range-day-cell"><span class="day-text">3</span></div>
            <div class="range-day-cell"><span class="day-text">4</span></div>
            <div class="range-day-cell"><span class="day-text">5</span></div>
            <div class="range-day-cell"><span class="day-text">6</span></div>
            <div class="range-day-cell holiday-sat"><span class="day-text">7</span></div>
            <div class="range-day-cell holiday-sun"><span class="day-text">8</span></div>
            <div class="range-day-cell"><span class="day-text">9</span></div>
            <div class="range-day-cell"><span class="day-text">10</span></div>
            <div class="range-day-cell"><span class="day-text">11</span></div>
            <div class="range-day-cell"><span class="day-text">12</span></div>
            <div class="range-day-cell"><span class="day-text">13</span></div>
            <div class="range-day-cell holiday-sat"><span class="day-text">14</span></div>
            <div class="range-day-cell holiday-sun"><span class="day-text">15</span></div>
            <div class="range-day-cell"><span class="day-text">16</span></div>
            <div class="range-day-cell"><span class="day-text">17</span></div>
            <div class="range-day-cell"><span class="day-text">18</span></div>
            <div class="range-day-cell"><span class="day-text">19</span></div>
            <div class="range-day-cell"><span class="day-text">20</span></div>
            <div class="range-day-cell holiday-sat"><span class="day-text">21</span></div>
            <div class="range-day-cell holiday-sun"><span class="day-text">22</span></div>
            <div class="range-day-cell"><span class="day-text">23</span></div>
            <div class="range-day-cell"><span class="day-text">24</span></div>
            <div class="range-day-cell"><span class="day-text">25</span></div>
            <div class="range-day-cell"><span class="day-text">26</span></div>
            <div class="range-day-cell"><span class="day-text">27</span></div>
            <div class="range-day-cell holiday-sat"><span class="day-text">28</span></div>
        </div>
        <div class="range-bottom-buttons">
            <button class="quick-btn active-filled">설정안함</button>
            <button class="quick-btn">1개월 후</button>
            <button class="quick-btn">3개월 후</button>
            <button class="quick-btn">6개월 후</button>
        </div>
    </div>


    

    
</body>
</html>
