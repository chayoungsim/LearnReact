<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휠 피커 - 몸무게 선택</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .demo-button {
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .demo-button:hover {
            background: #45a049;
        }

        .picker-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .picker-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .picker-modal-container {
            background: white;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: translateY(50px);
            transition: transform 0.3s ease;
        }

        .picker-modal-overlay.active .picker-modal-container {
            transform: translateY(0);
        }

        .picker-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .picker-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .wheel-picker-wrapper {
            position: relative;
            height: 280px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .highlight-bar {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 56px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            z-index: 2;
        }

        .highlight-bar div {
            height: 2px;
            background: #e0e0e0;
        }

        .picker-columns {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 8px;
            position: relative;
        }

        .wheel-column {
            height: 100%;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
        }

        .wheel-column::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #999;
            scroll-snap-align: center;
            transition: all 0.2s ease;
            user-select: none;
        }

        .wheel-item.active {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }

        .padding-dummy {
            height: 112px;
            flex-shrink: 0;
        }

        #integer {
            width: 80px;
        }

        #decimals {
            width: 60px;
        }

        .dot {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin: 0 4px;
        }

        .unit-label {
            font-size: 20px;
            color: #666;
            margin-left: 8px;
            font-weight: 500;
        }

        .picker-footer {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .picker-footer button {
            flex: 1;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-bor {
            background: white;
            border: 2px solid #e0e0e0 !important;
            color: #666;
        }

        .btn-bor:hover {
            background: #f5f5f5;
            border-color: #ccc !important;
        }

        .btn-fill {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .result-display {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result-display.show {
            display: block;
        }

        .result-display p {
            font-size: 18px;
            color: #2e7d32;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <button class="demo-button" id="openPickerBtn">몸무게 선택하기</button>

    <div class="picker-modal-overlay" id="pickerModal">
        <div class="picker-modal-container">
            <div class="picker-header">
                <h3>몸무게 선택</h3>
            </div>              
            <div class="wheel-picker-wrapper">
                <div class="highlight-bar">
                    <div></div>
                    <div></div>
                </div>
                <div class="picker-columns">                        
                    <div class="wheel-column" id="integer"></div>
                    <div class="dot">.</div>
                    <div class="wheel-column" id="decimals"></div>
                    <div class="unit-label">kg</div>                       
                </div>
            </div>
            <div class="picker-footer">
                <button class="btn-bor" id="cancelBtn">취소</button>
                <button class="btn-fill btn-primary" id="addBtn">추가</button>
            </div>
        </div>
    </div>

    <div class="result-display" id="resultDisplay">
        <p id="resultText"></p>
    </div>

<script type="module">
export class WheelPicker {
  constructor(options = {}) {
    this.integerColumn = document.getElementById('integer');
    this.decimalColumn = document.getElementById('decimals');
    this.modal = document.getElementById('pickerModal');
    this.cancelBtn = document.getElementById('cancelBtn');
    this.addBtn = document.getElementById('addBtn');

    /* options */
    this.minValue = options.minValue ?? 20;
    this.maxValue = options.maxValue ?? 200;
    this.defaultInteger = options.defaultInteger ?? 70;
    this.defaultDecimal = options.defaultDecimal ?? 0;
    this.onConfirm = options.onConfirm ?? null;
    this.onCancel = options.onCancel ?? null;

    this.currentInteger = this.defaultInteger;
    this.currentDecimal = this.defaultDecimal;

    this.scrollTimer = null;

    this.init();
  }

  init() {
    this.renderWheels();
    this.attachEventListeners();
    this.scrollToDefault();
  }

  /* ---------- render ---------- */

  renderWheels() {
    this.integerColumn.innerHTML = '<div class="padding-dummy"></div>';
    for (let i = this.minValue; i <= this.maxValue; i++) {
      this.integerColumn.insertAdjacentHTML(
        'beforeend',
        `<div class="wheel-item" data-value="${i}">${i}</div>`
      );
    }
    this.integerColumn.insertAdjacentHTML('beforeend', '<div class="padding-dummy"></div>');

    this.decimalColumn.innerHTML = '<div class="padding-dummy"></div>';
    for (let i = 0; i <= 9; i++) {
      this.decimalColumn.insertAdjacentHTML(
        'beforeend',
        `<div class="wheel-item decimal" data-value="${i}">${i}</div>`
      );
    }
    this.decimalColumn.insertAdjacentHTML('beforeend', '<div class="padding-dummy"></div>');
  }

  /* ---------- events ---------- */

  attachEventListeners() {
    this.integerColumn.addEventListener('scroll', () =>
      this.handleScroll(this.integerColumn, 'integer')
    );
    this.decimalColumn.addEventListener('scroll', () =>
      this.handleScroll(this.decimalColumn, 'decimal')
    );

    this.addDragScrolling(this.integerColumn);
    this.addDragScrolling(this.decimalColumn);

    this.cancelBtn?.addEventListener('click', () => this.close());
    this.addBtn?.addEventListener('click', () => this.confirm());

    this.modal?.addEventListener('click', (e) => {
      if (e.target === this.modal) this.close();
    });
  }

  handleScroll(column, type) {
    clearTimeout(this.scrollTimer);
    this.scrollTimer = setTimeout(() => {
      this.snapToNearest(column, type);
    }, 50);
  }

  snapToNearest(column, type) {
    const items = [...column.querySelectorAll('.wheel-item')];
    const centerY = column.getBoundingClientRect().top + column.offsetHeight / 2;

    let closest = null;
    let min = Infinity;

    items.forEach(item => {
      const y = item.getBoundingClientRect().top + item.offsetHeight / 2;
      const dist = Math.abs(centerY - y);
      if (dist < min) {
        min = dist;
        closest = item;
      }
    });

    if (!closest) return;

    column.scrollTo({
      top: closest.offsetTop - 112,
      behavior: 'smooth'
    });

    items.forEach(i => i.classList.remove('active'));
    closest.classList.add('active');

    const value = parseInt(closest.dataset.value, 10);
    type === 'integer'
      ? (this.currentInteger = value)
      : (this.currentDecimal = value);
  }

  scrollToDefault() {
    this.setColumnValue(this.integerColumn, this.defaultInteger);
    this.setColumnValue(this.decimalColumn, this.defaultDecimal);
  }

  setColumnValue(column, value) {
    const item = [...column.querySelectorAll('.wheel-item')]
      .find(el => parseInt(el.dataset.value, 10) === value);

    if (!item) return;

    column.scrollTop = item.offsetTop - 112;
    item.classList.add('active');
  }

  /* ---------- public API ---------- */

  open() {
    this.modal?.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  close() {
    this.modal?.classList.remove('active');
    document.body.style.overflow = '';
    this.onCancel?.();
  }

  confirm() {
    const value = parseFloat(`${this.currentInteger}.${this.currentDecimal}`);
    this.onConfirm?.({
      integer: this.currentInteger,
      decimal: this.currentDecimal,
      value,
      formatted: `${value} kg`
    });
    this.close();
  }

  setValue(integer, decimal) {
    this.defaultInteger = integer;
    this.defaultDecimal = decimal;
    this.currentInteger = integer;
    this.currentDecimal = decimal;
    this.scrollToDefault();
  }

  getValue() {
    return {
      integer: this.currentInteger,
      decimal: this.currentDecimal,
      value: parseFloat(`${this.currentInteger}.${this.currentDecimal}`)
    };
  }

  destroy() {
    this.integerColumn?._dragCleanup?.();
    this.decimalColumn?._dragCleanup?.();
  }
}
</script>

</body>
</html>
