<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>몸무게</title>
    <link rel="stylesheet" href="../../assets/styles/style.css" />
    <script type="module" src="../../utils/ui_common.js"></script>
  </head>
  <body>
    <!-- 전체 화면 모달 -->
    <div class="modal-overlay modal-fullscreen is-active" id="modalFullscreen">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title"></h2>
          <button class="modal-close" onclick="closeModal('modalFullscreen')">
            <i class="ico-x"></i><span class="sr-only">닫기</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-body-cont">
            <div class="title-type">
              <h3 class="text-h5">몸무게 정보를 입력해주세요</h3>
            </div>
            <ul class="link-arr-lists">
              <li>
                <a href="#" class="link-arr">
                  <div class="tit">
                    <i class="ico-date"></i>
                    <span class="text-b-lg-sb">날짜</span>
                  </div>
                  <span class="text-b-lg-sb hc1">오늘</span>
                  <i class="ico-arr"></i>
                </a>
              </li>
              <li>
                <a href="#" class="link-arr">
                  <div class="tit">
                    <i class="ico-clock"></i>
                    <span class="text-b-lg-sb">시간</span>
                  </div>
                  <span class="text-b-lg-sb hc1">오후 2:32</span>
                  <i class="ico-arr"></i>
                </a>
              </li>
              <li>
                <a href="#" class="link-arr">
                  <div class="tit">
                    <i class="ico-wht"></i>
                    <span class="text-b-lg-sb">몸무게</span>
                  </div>
                  <span class="text-b-lg-sb hc1">60 kg</span>
                  <i class="ico-arr"></i>
                </a>
              </li>
            </ul>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-fill btn-primary">
            <strong>추가하기</strong>
          </button>
        </div>
      </div>
    </div>

    <!-- 중앙 모달 -->
    <div class="modal-overlay modal-center is-active" id="modalCenter">
      <div class="modal-content">
        <div class="calendar-top-info">
            <p class="text-b-sm-m ">날짜 선택</p>
            <div class="title-type">
                <h1 class="text-h1">선택한 날짜</h1>
                <button type="button"><i class="ico-pen"></i></button>
            </div>
        </div>
        
        <div class="calendar-container">
            <div class="calendar-header">        
                <button type="button" class="nav-btn prev">
                    <i class="ico-arr"></i><span class="sr-only">이전</span>
                </button>
                <h2 class="header-title">
                    2026. 01
                    <span class="picker-arrow ">▼</span>
                </h2>        
                <button type="button" class="nav-btn next">
                    <i class="ico-arr"></i><span class="sr-only">다음</span>
                </button>
            </div>
            <div class="weekdays-grid">
                <div class="weekday">일</div>
                <div class="weekday">월</div>
                <div class="weekday">화</div>
                <div class="weekday">수</div>
                <div class="weekday">목</div>
                <div class="weekday">금</div>
                <div class="weekday">토</div>
            </div>
            <div class="days-grid">
                <div class="day-cell not-current">
                    <span class="day-number"></span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number"></span>
                </div>
                <div class="day-cell">
                    <span class="day-number">1</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">2</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">3</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">4</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">5</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">6</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">7</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">8</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">9</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">10</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">11</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">12</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">13</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">14</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">15</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">16</span>
                </div>
                <div class="day-cell selected">
                    <span class="day-number">17</span>
                </div>
                <div class="day-cell">
                    <span class="day-number">18</span>
                </div>
                <div class="day-cell end">
                    <span class="day-number">19</span>
                    <div class="donut-chart-wrap">
                        <svg width="40" height="40" class="donut-chart">
                            <circle class="donut-progress" stroke="#39B695" stroke-width="1" fill="transparent" r="20.5" cx="21" cy="21"></circle>
                        </svg>
                    </div>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">20</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">21</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">22</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">23</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">24</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">25</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">26</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">27</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">28</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">29</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">30</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number">31</span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number"></span>
                </div>
                <div class="day-cell not-current">
                    <span class="day-number"></span>
                </div>
            </div>
        </div>
        <div class="calendar-month-btns">
            <button type="button" class="btn hc1">취소</button>
            <button type="button" class="btn hc1">확인</button>
        </div>
      </div>
    </div>
  </body>
</html>
