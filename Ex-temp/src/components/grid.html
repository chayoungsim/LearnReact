<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .gird {
      border: 1px solid lime;
      display: grid;
      /* grid-template-columns: 1fr 1fr 1fr;       */
      gap: 20px;
      grid-auto-flow: row;
      grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
    }
    .gird div {
      border: 1px solid burlywood;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
    }
    .n1 {
      /* grid-column: 1 / 3;
      grid-row: 1 / 2; */

      
    }
  </style>
</head>
<body>

  <div class="gird">
    <div class="n1">1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
  </div>
</body>
</html>
