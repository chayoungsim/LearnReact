<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WheelPicker HTML 샘플</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .picker-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .wheel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .wheel-picker {
            width: 80px;
            height: 200px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .wheel-highlight {
            position: absolute;
            top: 80px;
            left: 0;
            right: 0;
            height: 40px;
            background: rgba(102, 126, 234, 0.1);
            border-top: 2px solid #667eea;
            border-bottom: 2px solid #667eea;
            pointer-events: none;
            z-index: 1;
        }

        .wheel-list {
            position: absolute;
            width: 100%;
            cursor: grab;
            user-select: none;
            transition: transform 0.3s ease;
        }

        .wheel-list.dragging {
            transition: none;
        }

        .wheel-list:active {
            cursor: grabbing;
        }

        .wheel-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #999;
            transition: all 0.2s;
        }

        .wheel-item.active {
            color: #667eea;
            font-size: 22px;
        }

        .result {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .result-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 28px;
            font-weight: bold;
        }

        .info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .info h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .info ul {
            list-style: none;
        }

        .info li {
            color: #666;
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }

        .info li:before {
            content: "•";
            color: #667eea;
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        .section-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎡 WheelPicker</h1>
            <p class="subtitle">휠을 드래그하여 값을 선택하세요</p>

            <div class="section-title">
                <span>📅</span>
                <span>날짜 선택</span>
            </div>

            <div class="picker-container">
                <div class="wheel-wrapper">
                    <div class="wheel-label">년</div>
                    <div class="wheel-picker" id="year-picker">
                        <div class="wheel-highlight"></div>
                        <div class="wheel-list" id="year-list"></div>
                    </div>
                </div>

                <div class="wheel-wrapper">
                    <div class="wheel-label">월</div>
                    <div class="wheel-picker" id="month-picker">
                        <div class="wheel-highlight"></div>
                        <div class="wheel-list" id="month-list"></div>
                    </div>
                </div>

                <div class="wheel-wrapper">
                    <div class="wheel-label">일</div>
                    <div class="wheel-picker" id="day-picker">
                        <div class="wheel-highlight"></div>
                        <div class="wheel-list" id="day-list"></div>
                    </div>
                </div>
            </div>

            <div class="result">
                <div class="result-label">선택된 날짜</div>
                <div class="result-value" id="date-result">2025년 1월 13일</div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">
                <span>⏰</span>
                <span>시간 선택</span>
            </div>

            <div class="picker-container">
                <div class="wheel-wrapper">
                    <div class="wheel-label">시</div>
                    <div class="wheel-picker" id="hour-picker">
                        <div class="wheel-highlight"></div>
                        <div class="wheel-list" id="hour-list"></div>
                    </div>
                </div>

                <div class="wheel-wrapper">
                    <div class="wheel-label">분</div>
                    <div class="wheel-picker" id="minute-picker">
                        <div class="wheel-highlight"></div>
                        <div class="wheel-list" id="minute-list"></div>
                    </div>
                </div>
            </div>

            <div class="result">
                <div class="result-label">선택된 시간</div>
                <div class="result-value" id="time-result">12:00</div>
            </div>
        </div>

        <div class="card info">
            <h3>💡 사용 방법</h3>
            <ul>
                <li>휠을 위아래로 드래그하여 값을 변경할 수 있습니다</li>
                <li>마우스와 터치 모두 지원합니다</li>
                <li>중앙의 하이라이트 영역이 현재 선택된 값입니다</li>
                <li>드래그를 멈추면 가장 가까운 값으로 자동 정렬됩니다</li>
            </ul>
        </div>
    </div>

   <script type="module" src="../../../utils/picker-init.js"></script>
</body>
</html>
