    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        .switch input {
            display: none;
        }
        .switch label {
            display: block;
            position: relative;
            background: #cacaca;
            border-radius: 40px;
            width: 78px;           
            height:38px;
            cursor: pointer;
        }
        .switch label::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            transition: 0.35s;
        }
        .switch input:checked + label {
            background: #34c759;
        }
        .switch input:checked + label::after {           
            transform: translateX(38px);
            transition: 0.35s;
        }
        /* .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .week-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        } */

     
    .checkForm label {
        display: flex;
        align-items: center;
        gap:0.8rem;
        
    }
    .checkForm .checkForm-custom {
        position: relative;
        width: 2.4rem;
        height:2.4rem;
        background: #cacaca;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
    }
   
    .checkForm input[type="checkbox"] + label .checkForm-custom::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 14px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: translate(-50%,-65%) rotate(45deg);
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .checkForm input[type="checkbox"]:checked + label .checkForm-custom::after {
        opacity: 1;
    }


    .checkForm input[type="radio"] + label .checkForm-custom {
        border-radius: 50%;       
    }
   
    .checkForm input[type="radio"] + label .checkForm-custom::after {
        content: '';
        display: block;
        position: absolute;
        left: 50%;
        top: 50%; 
        transform: translate(-50%,-50%) scale(0);
        width:1.2rem;
        height:1.2rem;
        background: #222;
        border-radius: 50%;
        transition: transform 0.2s ease;
    }

    .checkForm input[type="radio"]:checked + label .checkForm-custom::after {
        transform: translate(-50%,-50%) scale(1);
    }


    </style>
</head>
<body>
