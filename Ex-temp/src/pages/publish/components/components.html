<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>components</title>
    <link rel="stylesheet" href="../../../assets/styles/font.css" />
    <link rel="stylesheet" href="../../../assets/styles/style.css" />
    <script type="module" src="../../../utils/ui_common.js"></script>

    <style>
      .icons-wrap {
         width: 375px;
         display:flex;
         flex-wrap: wrap;
         gap: 2rem;
         padding: 1.6rem;
      }          
      .imgs-wrap{
        width: 375px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap:1.6rem;
      }
      .wrap-400 {
        width:401px;
        padding:13px
      }
      .btn-full {
        width: 375px;
        display: flex;
        flex-direction: column;
        gap:1rem;
      }
      .wrap-title-wrap {
        width: 375px;
        display: flex;
        flex-direction: column;
        gap: 2rem;      
        border: 1px solid #ddd;  
        padding: 1.6rem;
      }
      .components-wrap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap:5rem;
      }
    </style>
  </head>
  <body>

 
     
  <div class="components-wrap">

    <div class="icons-wrap">
      <i class="ico-h-search"></i>
      <i class="ico-h-cart"></i>
      <i class="ico-h-alarm"></i>
      <i class="ico-back"></i>
      <i class="ico-plus"></i>
      <i class="ico-next"></i>
      <i class="ico-trash"></i>
      <i class="ico-cart"></i>
      <i class="ico-hbot"></i>
      <i class="ico-myh"></i>
      <i class="ico-more"></i>
      <i class="ico-trash"></i>
      <i class="ico-camera"></i>
      <i class="ico-arr-down"></i>
      <i class="ico-x"></i>
      <i class="ico-sett"></i>
      <i class="ico-date"></i>
      <i class="ico-clock"></i>
      <i class="ico-wht"></i>
      <i class="ico-arr"></i>
      <i class="ico-trg-down"></i>
      <i class="ico-keyboard"></i>
      <i class="ico-recomm"></i>
      <i class="ico-sh-clock"></i>
      <i class="ico-sh-search"></i>
      <i class="ico-arr2"></i>
      <i class="ico-chk"></i>

      <i class="pill-prohibited"></i>
      <i class="pill-forgot"></i>
      <i class="pill-taken"></i>
      <i class="pill-ignored"></i>
      <i class="pill-empty"></i>
      <i class="ico-sliver"></i>
      <i class="ico-scale"></i>
      <i class="ico-ht-down"></i>
      <i class="ico-ht-up"></i>
      <i class="ht-running"></i>
      <i class="ht-work"></i>          
      <i class="ht-fire"></i>
      <i class="ht-weigth"></i>
      <i class="ht-blood"></i>
      <i class="ht-icn"></i>
      <i class="ht-heart"></i>
      <i class="ht-hs1"></i>
      <i class="ht-hs2"></i>
    </div>    

    <div class="wrap-400" style="background-color: #555;">
        <div class="top-header-nav">
            <button type="button" class="btn-back">
            <i class="ico-back"></i><span class="sr-only">이전</span>
            </button>
            <h2>복약</h2>
        </div>
        <br>
        <div class="top-header-nav">
            <button type="button" class="btn-back">
            <i class="ico-back"></i><span class="sr-only">이전</span>
            </button>
            <h2>복약</h2>
            <button type="button" class="btn-resist">
            <i class="ico-plus"></i><span>가족등록</span>
            </button>
        </div>
        <br>
        <div class="top-header-nav">
            <h2>약 추가</h2>
            <button type="button" class="btn-trash">
                <i class="ico-trash"></i><span>삭제</span>
            </button>
        </div>
        <br>
        <div class="top-header-nav">
            <h2>약 추가</h2>
            <button type="button" class="btn-close">
                <i class="ico-x"></i><span class="sr-only">닫기</span>
            </button>
        </div>
        <br>
        <div class="top-main-nav">
            <h2>더보기</h2>
            <button type="button"><i class="ico-sett"></i><span class="sr-only">설정</span></button>
        </div>
        <div class="bottom-nav">
            <button type="button"><i class="ico-cart"></i><span>쇼핑</span></button>
            <button type="button">
            <i class="ico-hbot"></i><span>건강봇</span>
            </button>
            <button type="button">
            <i class="ico-myh"></i><span>내 건강</span>
            </button>
            <button type="button">
            <i class="ico-more"></i><span>더보기</span>
            </button>
        </div>
    </div>
    <div class="wrap-400" style="background-color: #555;">
        <div class="top-header-search">
            <button type="button" class="btn-back"><i class="ico-back"></i><span class="sr-only">이전</span></button>
            <input type="text" placeholder="약이나 영양제 이름을 검색할 수 있습니다." class="ipt">
            <button type="button" class="btn-camera"><i class="ico-camera"></i></button>
        </div>
        <br>
        <div class="top-header-search">
            <button type="button" class="btn-back"><i class="ico-back"></i><span class="sr-only">이전</span></button>
            <input type="text" placeholder="약이나 영양제 이름을 검색할 수 있습니다." class="ipt" value="타이레">
            <button type="button" class="btn-close-circle"><i class="ico-x"></i><span class="sr-only">닫기</span></button>
        </div>
        <ul class="top-header-search-list">
            <li class="first"><i></i><span>타이레</span><button type="button">직접 입력</button></li>
            <li><i class="ico-sh-clock"></i><span>타이레놀</span></li>
            <li><i class="ico-sh-search"></i><span><strong>타이레</strong>놀</span></li>
            <li><i class="ico-sh-search"></i><span><strong>타이레</strong>놀정</span></li>
        </ul>
        <br>
        <div class="search-box">
          <i class="ico-sh-search"></i>
          <input type="text" placeholder="약이나 영양제 이름을 검색할 수 있습니다.">
        </div>
        <br>
        <div class="search-box">
          <i class="ico-sh-search"></i>
          <input type="text" placeholder="약이나 영양제 이름을 검색할 수 있습니다." value="타이레놀">
        </div>
    </div>      
    <div class="wrap-title-wrap">
        <div class="title-type">
            <h3 class="hty1">구매 영양제</h3>
            <div class="more"><button type="button" class="btn-detail"><span>더보기</span><i class="ico-arr"></i></button></div>
        </div>
        <div class="title-type">
            <h3 class="hty2">나의 루틴 통계</h3>   
            <div class="more">
                <a href="#" class="btn-detail"><span>자세히 보기</span><i class="ico-arr"></i></a>
            </div>         
        </div>
        <div class="title-type">
            <h3 class="hty2">노화 속도에 따른 <br><span class="hc1">질환 위험</span>을 알려드려요</h3>            
        </div>
        <div class="title-type">
            <h3 class="hty3">검진 및 진료 내역</h3>
        </div>
    </div>
    
    <div>
      <div class="switch">
        <input type="checkbox" id="switchTg">
        <label for="switchTg">
            <span class="sr-only">설정</span>
        </label>
      </div>

      <button type="button" class="n-prev">
        <i class="ico-next"></i><span class="sr-only">이전</span>
      </button>
      <button type="button" class="n-next">
        <i class="ico-next"></i><span class="sr-only">다음</span>
      </button>

      <button>
        <i class="ico-arrow" aria-hidden="true"></i>
        <span class="sr-only">화살표</span>
      </button>

      <span class="checkForm">
        <input type="checkbox" id="chk1">
        <label for="chk1">
            <span class="checkForm-custom"></span>
            <span class="checkForm-label">체크박스</span>
        </label>
     </span>
     <span class="checkForm">
        <input type="radio" id="rdo1" name="rdo">
        <label for="rdo1">
            <span class="checkForm-custom"></span>
            <span class="checkForm-label">라디오</span>
        </label>
     </span>
     <span class="checkForm">
        <input type="radio" id="rdo2" name="rdo">
        <label for="rdo2">
            <span class="checkForm-custom"></span>
            <span class="checkForm-label">라디오</span>
        </label>
     </span>
    
    </div> 
      
    <div class="wrap-400">
        <ul class="tab">
            <li class="active"><button type="button">건강 데이터</button></li>
            <li><button type="button">AI 건강 분석</button></li>
        </ul>
        <br>
        <ul class="tab">
            <li class="active"><button type="button">1주</button></li>
            <li><button type="button">1개월</button></li>
            <li><button type="button">3개월</button></li>
            <li><button type="button">6개월</button></li>
            <li><button type="button">1년</button></li>
        </ul>
        <br>        
    </div>
     
    <div class="btn-full">
      <button type="button" class="btn-bor">
        <i class="ico-refresh"></i><span>button</span>
      </button>
      <button type="button" class="btn-bor">button</button>
      <button type="button" class="btn-bor">
        <i class="ico-plus"></i><strong>button</strong>
      </button>
      <button type="button" class="btn-fill hc1">
        <i class="ico-plus"></i><strong>button</strong>
      </button>
      <button type="button" class="btn-fill hc1">
        <i class="ico-refresh"></i><strong>button</strong>
      </button>
      <button type="button" class="btn-bor">
        <span>button</span><i class="ico-arr-down"></i>
      </button>
      <button type="button" class="btn-fill"><strong>button</strong></button>
      <button type="button" class="btn-fill">
        <span>더보기</span><i class="ico-arr-down"></i>
      </button>
      <button type="button" class="btn-fill bghc1"><strong>button</strong></button>
    </div>

    <span class="today-date" onclick="openModal(event)" modal-id="pop05">오늘</span>
    <div id="pop05" style="display: none" class="type-bottom">
      <div class="modal-header">header</div>
      <div class="modal-cont">cont</div>
      <div class="modal-footer">footer</div>
    </div>


    </div>
  </body>
</html>
