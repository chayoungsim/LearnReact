<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../assets/styles/font.css" />
    <link rel="stylesheet" href="../../../assets/styles/style.css" />

    <link rel="stylesheet" href="../../../assets/styles/weightGoalPage.css">
</head>
<body>
    <div class="picker-modal-overlay">
            <div class="picker-modal-container">
                <div class="picker-header">
                    <h3>몸무게 입력</h3>
                </div>
                <div class="picker-date-info">
                    <span class="label-today">오늘</span>
                    <span class="label-time">{currentTime}</span>
                </div>
                <div class="wheel-picker-wrapper">
                    <div class="highlight-bar"></div>
                    <div class="picker-columns">                        
                        <div class="wheel-column">
                            <div class="padding-dummy"></div>
                            <div class="wheel-item ">30</div>
                            <div class="wheel-item ">31</div>
                            <div class="wheel-item ">32</div>
                            <div class="wheel-item ">33</div>
                            <div class="wheel-item ">34</div>
                            <div class="wheel-item ">35</div>
                            <div class="wheel-item ">36</div>
                            <div class="padding-dummy"></div>
                        </div>
                        <div class="wheel-column">
                            <div class="padding-dummy"></div>
                            <div class="wheel-item decimal ">.1</div>
                            <div class="wheel-item decimal ">.2</div>
                            <div class="wheel-item decimal ">.3</div>
                            <div class="wheel-item decimal ">.4</div>
                            <div class="wheel-item decimal ">.5</div>
                            <div class="wheel-item decimal ">.6</div>
                            <div class="padding-dummy"></div>
                        </div>
                        <div class="unit-label">kg</div>
                    </div>
                </div>

                <div class="picker-footer">
                    <button class="btn-cancel" onClick={onClose}>취소</button>
                    <button class="btn-add" onClick={handleAdd}>추가</button>
                </div>
            </div>
        </div>
</body>
</html>
